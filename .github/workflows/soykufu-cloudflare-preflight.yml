name: SOY-KUFU Cloudflare connection check

# Read-only verification on manual runs or changes to this workflow only.
# No deployment, Meta access, or Instagram messages.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/soykufu-cloudflare-preflight.yml']

permissions:
  contents: read

jobs:
  verify-token:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify Cloudflare token without displaying it
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const token = (process.env.CLOUDFLARE_API_TOKEN ?? '').trim();
          if (!token) {
            console.error('CLOUDFLARE_API_TOKEN secret is missing.');
            process.exit(1);
          }
          if (!/^[A-Za-z0-9_-]{20,}$/.test(token)) {
            console.error('TOKEN_FORMAT_INVALID: Store only the token, without a command, Bearer prefix, quotes, or line breaks.');
            process.exit(1);
          }
          try {
            const response = await fetch('https://api.cloudflare.com/client/v4/user/tokens/verify', {
              headers: { Authorization: `Bearer ${token}` },
              signal: AbortSignal.timeout(20000),
            });
            const data = await response.json();
            if (!response.ok || data.success !== true || data.result?.status !== 'active') {
              console.error(`Token verification failed (HTTP ${response.status}).`);
              process.exit(1);
            }
            console.log('Cloudflare token is active. No resources or Instagram settings were changed.');

            const accountResponse = await fetch('https://api.cloudflare.com/client/v4/accounts', {
              headers: { Authorization: `Bearer ${token}` },
              signal: AbortSignal.timeout(20000),
            });
            const accounts = await accountResponse.json();
            if (!accountResponse.ok || accounts.success !== true || !Array.isArray(accounts.result)) {
              console.error(`ACCOUNT_DISCOVERY_FAILED (HTTP ${accountResponse.status}). Token verification succeeded.`);
              process.exit(1);
            }
            if (accounts.result.length !== 1 || !/^[a-f0-9]{32}$/.test(accounts.result[0]?.id ?? '')) {
              console.error('ACCOUNT_SELECTION_REQUIRED: Expected exactly one permitted account.');
              process.exit(1);
            }
            const accountId = accounts.result[0].id;
            console.log(`Permitted Cloudflare account ID: ${accountId}`);
            for (const [label, path] of [
              ['D1', 'd1/database'],
              ['R2', 'r2/buckets'],
              ['Workers', 'workers/scripts'],
              ['Pages', 'pages/projects'],
            ]) {
              const check = await fetch(`https://api.cloudflare.com/client/v4/accounts/${accountId}/${path}`, {
                headers: { Authorization: `Bearer ${token}` },
                signal: AbortSignal.timeout(20000),
              });
              const result = await check.json();
              console.log(`${label} read check: ${check.ok && result.success === true ? 'OK' : 'FAILED'} (HTTP ${check.status}).`);
              if (!check.ok || result.success !== true) process.exitCode = 1;
            }

          } catch (error) {
            const kind = ['TypeError', 'TimeoutError', 'AbortError', 'SyntaxError'].includes(error?.name) ? error.name : 'UnknownError';
            console.error(`Cloudflare verification could not be completed (${kind}).`);
            process.exit(1);
          }
          NODE
