name: SOY-KUFU Cloudflare connection check

# Manual only. No deployment, Meta access, or Instagram messages.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-token:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify Cloudflare token without displaying it
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!token) {
            console.error('CLOUDFLARE_API_TOKEN secret is missing.');
            process.exit(1);
          }
          try {
            const response = await fetch('https://api.cloudflare.com/client/v4/user/tokens/verify', {
              headers: { Authorization: `Bearer ${token}` },
              signal: AbortSignal.timeout(20000),
            });
            const data = await response.json();
            if (!response.ok || data.success !== true || data.result?.status !== 'active') {
              console.error(`Token verification failed (HTTP ${response.status}).`);
              process.exit(1);
            }
            console.log('Cloudflare token is active. No resources or Instagram settings were changed.');
          } catch {
            console.error('Cloudflare verification could not be completed.');
            process.exit(1);
          }
          NODE
