name: SOY-KUFU initialize stopped Instagram storage
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/soykufu-bootstrap.yml']
permissions:
  contents: read
concurrency:
  group: soykufu-instagram-bootstrap
  cancel-in-progress: false
jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Create dedicated storage and verify stopped state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SOYKUFU_BOOTSTRAP_APPROVED: 'true'
        run: node scripts/soykufu-bootstrap.mjs
