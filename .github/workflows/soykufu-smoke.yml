name: SOY-KUFU verify stopped admin
on:
  workflow_dispatch:
    inputs:
      meta_readonly:
        description: 'Verify saved Meta token identity and grants only (no connection or sending)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['.github/workflows/soykufu-smoke.yml', 'scripts/soykufu-smoke.mjs', 'scripts/stopped-runtime-snapshot.mjs', 'scripts/stopped-time-travel-proof.mjs', 'scripts/stopped-recovery-reference.mjs', 'scripts/soykufu-meta-readonly.mjs', 'scripts/soykufu-meta-readonly.test.mjs']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read stopped schema and deployed runtime metadata without changes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          IG_HARNESS_API_KEY: ${{ secrets.IG_HARNESS_API_KEY }}
        run: node scripts/soykufu-smoke.mjs
      - name: Test isolated export drill boundaries
        run: node --test scripts/stopped-export-drill.test.mjs scripts/stopped-export-drill-entry.test.mjs
      - name: Test Meta read-only verification boundaries without credentials
        run: node --test scripts/soykufu-meta-readonly.test.mjs
      - name: Verify Meta identity and grants only when explicitly requested
        if: github.event_name == 'workflow_dispatch' && inputs.meta_readonly == true && github.ref == 'refs/heads/main' && github.repository == 'soykufu/ig-harness-oss'
        env:
          IG_META_USER_ACCESS_TOKEN: ${{ secrets.IG_META_USER_ACCESS_TOKEN }}
        run: node scripts/soykufu-meta-readonly.mjs
