name: SOY-KUFU verify stopped admin
on:
  workflow_dispatch:
    inputs:
      receiving_backend_audit:
        description: 'Audit accepted receiving backend and actual paused guardrails only; never replace, subscribe or send'
        type: boolean
        default: false
      receiving_preflight:
        description: 'Read registered account and app receiving prerequisites only; never configure, subscribe or send'
        type: boolean
        default: false
      meta_pair_readonly:
        description: 'Check saved user token belongs to the fixed Meta app only; no registration, setup or sending'
        type: boolean
        default: false
      app_webhook_readonly:
        description: 'Inspect the fixed Meta app subscriptions only; no setup, repair, callback request or sending'
        type: boolean
        default: false
      deployment_candidate:
        description: 'Read current settings and build stopped candidate offline; never deploy or change secrets'
        type: boolean
        default: false
      backup_preflight:
        description: 'Read deployed backup namespace evidence and key presence only; no export or object writes'
        type: boolean
        default: false
      meta_readonly:
        description: 'Verify saved Meta token identity and grants only (no connection or sending)'
        type: boolean
        default: false
      recovery_reference:
        description: 'Existing saved recovery reference JSON; read-only recheck, never restore'
        type: string
        default: ''
      restore_plan:
        description: 'Completed restore audit JSON; read-only, restore execution retired'
        type: string
        default: ''
      native_migration_review:
        description: 'Verified native recovery receipt JSON; read-only migration candidate, no application'
        type: string
        default: ''
  push:
    branches: [main]
    paths: ['scripts/stopped-receiving-app-id-once.mjs', 'scripts/stopped-receiving-app-id-once.test.mjs', 'scripts/stopped-receiving-secret-once.mjs', 'scripts/stopped-receiving-secret-once.test.mjs', 'scripts/stopped-receiving-backend-audit.mjs', 'scripts/stopped-receiving-backend-audit.test.mjs', 'scripts/stopped-receiving-backend-once.mjs', 'scripts/stopped-receiving-backend-once.test.mjs', 'scripts/stopped-receiving-preflight.mjs', 'scripts/stopped-receiving-preflight.test.mjs', 'scripts/stopped-registered-account.test.mjs', 'scripts/stopped-installation-snapshot.mjs', 'scripts/stopped-account-preparation-apply.mjs', 'scripts/stopped-account-preparation-apply.test.mjs', 'scripts/stopped-account-registration-once.mjs', 'scripts/stopped-account-registration-once.test.mjs', '.github/workflows/soykufu-smoke.yml', 'scripts/soykufu-smoke.mjs', 'scripts/stopped-runtime-snapshot.mjs', 'scripts/stopped-time-travel-proof.mjs', 'scripts/stopped-recovery-reference.mjs', 'scripts/soykufu-meta-readonly.mjs', 'scripts/soykufu-meta-readonly.test.mjs', 'scripts/stopped-connection-readiness.mjs', 'scripts/stopped-connection-readiness.test.mjs', 'scripts/soykufu-app-webhook-readonly.mjs', 'scripts/soykufu-app-webhook-readonly.test.mjs', 'scripts/soykufu-meta-pair-readonly.mjs', 'scripts/soykufu-meta-pair-readonly.test.mjs', 'scripts/stopped-saved-recovery.mjs', 'scripts/stopped-saved-recovery.test.mjs', 'scripts/stopped-once-restore.mjs', 'scripts/stopped-once-restore.test.mjs', 'scripts/stopped-migration-review.mjs', 'scripts/stopped-migration-review.test.mjs', 'scripts/stopped-database-envelope.mjs', 'scripts/stopped-database-envelope.test.mjs', 'scripts/stopped-export-drill.mjs', 'scripts/stopped-export-drill.test.mjs', 'scripts/stopped-backup-preflight.mjs', 'scripts/stopped-backup-preflight.test.mjs', 'scripts/recovery-bucket-guard.mjs', 'scripts/recovery-bucket-guard.test.mjs', 'scripts/stopped-protection-apply.mjs', 'scripts/stopped-protection-apply.test.mjs', 'scripts/stopped-database-copy-once.mjs', 'scripts/stopped-database-copy-once.test.mjs', 'scripts/stopped-database-copy-entry.mjs', 'scripts/stopped-database-copy-entry.test.mjs', 'scripts/stopped-migration-apply.mjs', 'scripts/stopped-migration-apply.test.mjs', 'scripts/stopped-approved-migration-plan.json', 'scripts/stopped-deployment-candidate.mjs', 'scripts/stopped-deployment-candidate.test.mjs', 'scripts/stopped-backend-apply.mjs', 'scripts/stopped-backend-apply.test.mjs']
permissions:
  contents: read
concurrency:
  group: soykufu-existing-stopped-admin
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read stopped schema and deployed runtime metadata without changes
        if: github.event_name != 'workflow_dispatch' || (inputs.restore_plan == '' && inputs.native_migration_review == '' && inputs.backup_preflight != true)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          IG_HARNESS_API_KEY: ${{ secrets.IG_HARNESS_API_KEY }}
          STOPPED_REGISTERED_PHASE: '1'
        run: node scripts/soykufu-smoke.mjs
      - name: Test isolated export drill boundaries
        run: node --test scripts/stopped-export-drill.test.mjs scripts/stopped-export-drill-entry.test.mjs
      - name: Test Meta read-only verification boundaries without credentials
        run: node --test scripts/soykufu-meta-readonly.test.mjs
      - name: Test stopped account planning boundaries without credentials
        run: node --test scripts/stopped-connection-readiness.test.mjs
      - name: Test app webhook read-only boundaries without credentials
        run: node --test scripts/soykufu-app-webhook-readonly.test.mjs
      - name: Test approved stopped connection boundaries without credentials
        run: node --test scripts/stopped-account-preparation-apply.test.mjs scripts/stopped-account-registration-once.test.mjs scripts/stopped-registered-account.test.mjs
      - name: Test Meta token app pairing without credentials
        run: node --test scripts/soykufu-meta-pair-readonly.test.mjs
      - name: Check saved Meta credential pairing only when explicitly requested
        if: github.event_name == 'workflow_dispatch' && inputs.meta_pair_readonly == true && github.ref == 'refs/heads/main' && github.repository == 'soykufu/ig-harness-oss'
        env:
          IG_META_APP_SECRET: ${{ secrets.IG_META_APP_SECRET }}
          IG_META_USER_ACCESS_TOKEN: ${{ secrets.IG_META_USER_ACCESS_TOKEN }}
        run: node scripts/soykufu-meta-pair-readonly.mjs
      - name: Inspect fixed Meta app webhook metadata only when explicitly requested
        if: github.event_name == 'workflow_dispatch' && inputs.app_webhook_readonly == true && github.ref == 'refs/heads/main' && github.repository == 'soykufu/ig-harness-oss'
        env:
          IG_META_APP_SECRET: ${{ secrets.IG_META_APP_SECRET }}
        run: node scripts/soykufu-app-webhook-readonly.mjs
      - name: Verify Meta identity and grants only when explicitly requested
        if: github.event_name == 'workflow_dispatch' && inputs.meta_readonly == true && github.ref == 'refs/heads/main' && github.repository == 'soykufu/ig-harness-oss'
        env:
          IG_META_USER_ACCESS_TOKEN: ${{ secrets.IG_META_USER_ACCESS_TOKEN }}
        run: node scripts/soykufu-meta-readonly.mjs
      - name: Test encrypted database copy boundaries offline without credentials
        run: node --test scripts/stopped-database-envelope.test.mjs
      - name: Test saved recovery point boundaries offline
        run: node --test scripts/stopped-saved-recovery.test.mjs
      - name: Recheck existing saved recovery point without restoring
        if: github.event_name == 'workflow_dispatch' && inputs.recovery_reference != '' && github.ref == 'refs/heads/main' && github.repository == 'soykufu/ig-harness-oss'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RECOVERY_REFERENCE: ${{ inputs.recovery_reference }}
        run: node scripts/stopped-saved-recovery.mjs
      - name: Test one-time restore boundaries offline
        run: node --test scripts/stopped-once-restore.test.mjs
      - name: Audit completed restore without mutation
        if: github.event_name == 'workflow_dispatch' && inputs.restore_plan != '' && github.ref == 'refs/heads/main' && github.repository == 'soykufu/ig-harness-oss'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RESTORE_PLAN: ${{ inputs.restore_plan }}
        run: node scripts/stopped-once-restore.mjs
      - name: Test stopped native recovery migration review offline
        run: node --test scripts/stopped-migration-review.test.mjs
      - name: Review exact stopped migrations against native recovery evidence without applying
        if: github.event_name == 'workflow_dispatch' && inputs.native_migration_review != '' && github.ref == 'refs/heads/main' && github.repository == 'soykufu/ig-harness-oss'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NATIVE_RECOVERY_EVIDENCE: ${{ inputs.native_migration_review }}
        run: node scripts/stopped-migration-review.mjs
      - name: Test reserved recovery namespace protection offline
        run: node --test scripts/recovery-bucket-guard.test.mjs
      - name: Test backup preflight without credentials
        run: node --test scripts/stopped-backup-preflight.test.mjs
      - name: Read deployed backup namespace and key presence only
        if: github.event_name == 'workflow_dispatch' && inputs.backup_preflight == true && github.ref == 'refs/heads/main' && github.repository == 'soykufu/ig-harness-oss'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          IG_DATABASE_BACKUP_KEY: ${{ secrets.IG_DATABASE_BACKUP_KEY }}
        run: node scripts/stopped-backup-preflight.mjs
      - name: Test protection-only operation boundaries offline
        run: node --test scripts/stopped-protection-apply.test.mjs
      - name: Test one-time database copy boundaries offline
        run: node --test scripts/stopped-database-copy-once.test.mjs scripts/stopped-database-copy-entry.test.mjs
      - name: Test exact approved migration operation offline
        run: node --test scripts/stopped-migration-apply.test.mjs
      - name: Test stopped candidate boundaries offline
        run: node --test scripts/stopped-deployment-candidate.test.mjs
      - uses: pnpm/action-setup@v4
        if: github.event_name == 'workflow_dispatch' && inputs.deployment_candidate == true
        with:
          version: 9.15.4
      - name: Install candidate build dependencies
        if: github.event_name == 'workflow_dispatch' && inputs.deployment_candidate == true
        run: pnpm install --frozen-lockfile
      - name: Build candidate dependencies
        if: github.event_name == 'workflow_dispatch' && inputs.deployment_candidate == true
        run: pnpm --filter @ig-harness/shared --filter @ig-harness/ig-sdk build
      - name: Read settings and build deployment candidate without mutation
        if: github.event_name == 'workflow_dispatch' && inputs.deployment_candidate == true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/stopped-deployment-candidate.mjs
      - name: Test scoped backend replacement boundaries offline
        run: node --test scripts/stopped-backend-apply.test.mjs

      - name: Test stopped receiving preflight boundaries
        run: node --test scripts/stopped-receiving-preflight.test.mjs
      - name: Observe stopped receiving prerequisites only
        if: github.event_name == 'workflow_dispatch' && inputs.receiving_preflight == true && github.ref == 'refs/heads/main' && github.repository == 'soykufu/ig-harness-oss'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          IG_HARNESS_API_KEY: ${{ secrets.IG_HARNESS_API_KEY }}
          IG_META_APP_SECRET: ${{ secrets.IG_META_APP_SECRET }}
        run: node scripts/stopped-receiving-preflight.mjs

      - name: Test approved stopped receiving backend boundaries
        run: node --test scripts/stopped-receiving-backend-once.test.mjs
      - name: Test receiving backend read-only acceptance
        run: node --test scripts/stopped-receiving-backend-audit.test.mjs
      - name: Test existing receiving secret installation boundaries
        run: node --test scripts/stopped-receiving-secret-once.test.mjs
      - name: Test stopped public Meta app ID settings boundary
        run: node --test scripts/stopped-receiving-app-id-once.test.mjs
      - name: Audit accepted receiving backend without replacement
        if: github.event_name == 'workflow_dispatch' && inputs.receiving_backend_audit == true && github.ref == 'refs/heads/main' && github.repository == 'soykufu/ig-harness-oss'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          IG_HARNESS_API_KEY: ${{ secrets.IG_HARNESS_API_KEY }}
        run: node scripts/stopped-receiving-backend-audit.mjs

      - name: Test verification credential metadata boundaries
        run: node --test scripts/stopped-verify-token-readonly.test.mjs

      - name: Test retired verification credential installation boundaries offline
        run: node --test scripts/stopped-receiving-verify-token-once.test.mjs
