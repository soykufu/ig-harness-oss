name: SOY-KUFU verify stopped admin
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/soykufu-smoke.yml', 'scripts/soykufu-smoke.mjs', 'scripts/stopped-runtime-snapshot.mjs', 'scripts/stopped-time-travel-proof.mjs', 'scripts/stopped-recovery-reference.mjs']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read stopped schema and deployed runtime metadata without changes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          IG_HARNESS_API_KEY: ${{ secrets.IG_HARNESS_API_KEY }}
        run: node scripts/soykufu-smoke.mjs
      - name: Test isolated export drill boundaries
        run: node --test scripts/stopped-export-drill.test.mjs scripts/stopped-export-drill-entry.test.mjs
